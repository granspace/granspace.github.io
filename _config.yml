title: Granspace
tagline: Manage the dev projects scattered across your machine
description: >-
  Granspace is a local manager for the dev projects on your machine: discover,
  organize, run and track them — web dashboard, desktop app and MCP.

# GitHub Pages project site. Every internal link must use `relative_url` so it
# respects this base path.
url: https://granspace.github.io
baseurl: /site

# External links reused across the site (kept in one place).
repos:
  extensions: https://github.com/granspace/extensions
  releases: https://github.com/granspace/site/releases/latest
  feedback: https://github.com/granspace/feedback

# Donation methods for the /donate/ page. Fill in only what you use — each method
# renders only when its value is set here (empty string = hidden on the page).
donate:
  pix: ""              # PIX key (email, phone, CPF, random key, or a full BR Code payload)
  buymeacoffee: ""     # full URL, e.g. https://www.buymeacoffee.com/yourname
  bitcoin: ""          # BTC receiving address
  github_sponsors: ""  # GitHub username, e.g. yourname

# Docs are a collection: one Markdown file per topic, output as its own page.
collections:
  docs:
    output: true
    permalink: /docs/:path/
  docs_pt:
    output: true
    permalink: /pt-br/docs/:path/

defaults:
  - scope: { path: "", type: docs }
    values: { layout: doc, lang: en }
  - scope: { path: "", type: docs_pt }
    values: { layout: doc, lang: pt-br }

# Markdown / syntax highlighting.
markdown: kramdown
kramdown:
  syntax_highlighter: rouge

exclude:
  - README.md
  - IMAGES.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .sass-cache
  - node_modules
