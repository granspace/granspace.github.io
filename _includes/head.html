{%- comment -%} Document head. Title falls back to the site title. {%- endcomment -%}
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% if page.title %}{{ page.title }} · Granspace{% else %}Granspace — {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}" />
<link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}" />
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}" />
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />
<!-- Open Graph / social sharing (WhatsApp, Facebook, LinkedIn, …) -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}" />
<meta property="og:description" content="{{ page.description | default: site.description | default: site.tagline }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ '/images/og-banner.png' | absolute_url }}" />
<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Granspace" />
<!-- Twitter card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}" />
<meta name="twitter:description" content="{{ page.description | default: site.description | default: site.tagline }}" />
<meta name="twitter:image" content="{{ '/images/og-banner.png' | absolute_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/base.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/layout.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/components.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}" />
<link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}" />
