{%- comment -%} Top navigation, shared by every page. {%- endcomment -%}
<header class="site-header">
  <div class="wrap site-header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="26" fill="#6366f1" />
        <circle cx="50" cy="50" r="22" fill="none" stroke="#fff" stroke-width="8" />
        <circle cx="50" cy="50" r="6" fill="#fff" />
      </svg>
      <span>devhub</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/docs/' | relative_url }}">Docs</a>
      <a href="{{ '/download/' | relative_url }}">Download</a>
      <a href="{{ site.repos.extensions }}">Extensions</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme">◑</button>
    </nav>
  </div>
</header>
