---
layout: default
---
<div class="wrap docs-layout">
  <input type="checkbox" id="sidebar-toggle" class="sidebar-toggle-cb" hidden />
  <label for="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle navigation">☰ Contents</label>

  {% include docs-sidebar.html %}

  <main class="docs-content">
    {% if page.section %}<p class="doc-eyebrow">{{ page.section }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {{ content }}
  </main>
</div>
